[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamps-fs"
version = "0.1.0"
description = "Model-Agnostic Feature Selection via LOCO-Guided Adaptive Minipatch Sampling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "LAMPS authors" },
]
dependencies = [
  "numpy",
]

[tool.setuptools]
package-dir = { "" = "lamps_package" }

[tool.setuptools.packages.find]
where = ["lamps_package"]
include = ["lamps", "lamps.*"]
